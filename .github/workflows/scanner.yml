name: Scan Night Market Payment Discounts & Notify

on:
  schedule:
    # 每天台灣時間 10:00 與 17:00 (UTC 02:00, 09:00) 自動檢查夜市優惠與額滿狀況
    - cron: '0 2,9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵執行

# 賦予寫入權限以便自動 commit 更新後的 data/promotions.json
permissions:
  contents: write

jobs:
  scan-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scan & Quota Verification Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/scan_and_notify.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promotions.json
          git diff --staged --quiet || (git commit -m "Auto-update night market discounts & quota status [skip ci]" && git push)
